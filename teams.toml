# Boston Sports Calendar — team configuration
#
# Flip `enabled` to true/false to add or remove a team from the calendar.
# The daily cron run picks up changes automatically; to apply immediately run:
#   ./update_and_push.sh
#
# Fields: name (calendar display), search (ticket-search query name),
# emoji, sport (ESPN API path), id (ESPN team id or slug), league
# (season-parameter group in update_calendar.py).

[redsox]
enabled = true
name = "Red Sox"
search = "Boston Red Sox"
emoji = "⚾"
sport = "baseball/mlb"
id = "bos"
league = "mlb"

[celtics]
enabled = true
name = "Celtics"
search = "Boston Celtics"
